name: Publish images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.4.1 (leading v accepted)"
        required: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            dockerfile: Dockerfile
            suffix: ""
            alias: ""
          - name: vl-baked
            dockerfile: Dockerfile.vl-baked
            suffix: "-vl-baked"
            alias: "edgaras0x4e/paddleocr-pdf-api:latest-baked"
          - name: text-baked
            dockerfile: Dockerfile.text-baked
            suffix: "-text-baked"
            alias: ""
          - name: structure-baked
            dockerfile: Dockerfile.structure-baked
            suffix: "-structure-baked"
            alias: ""
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize version
        id: ver
        run: echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"
        env:
          RAW: ${{ inputs.version }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            edgaras0x4e/paddleocr-pdf-api:latest${{ matrix.suffix }}
            edgaras0x4e/paddleocr-pdf-api:v${{ steps.ver.outputs.version }}${{ matrix.suffix }}
            ${{ matrix.alias }}
